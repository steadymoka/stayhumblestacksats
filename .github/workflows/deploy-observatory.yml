name: Deploy Observatory to GitHub Pages

on:
  push:
    branches: [gh-pages]
    paths:
      - 'observatory/**'
      - '.github/workflows/deploy-observatory.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observatory
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: observatory/package-lock.json

      - run: npm ci
      - run: npx next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: observatory/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
